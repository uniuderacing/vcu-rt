  examples:
    name: Build examples
    runs-on: [self-hosted, X64, speed]
    container: # Run job in a container instead of the bare machine
     image: ghcr.io/uniuderacing/buildkit:latest
    needs: [build] # In order to speed up the build, we get the target folder from the first build job.
    strategy:
      fail-fast: false
      matrix:
        target:
          - xtensa-esp32s3-espidf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add GitHub to the SSH known hosts file
        run: mkdir -p ~/.ssh; ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          rustflags: "-D warnings"

      - name: Install Xtensa toolchain
        uses: ./.github/actions/xtensa-cached
        if: ${{ matrix.target == 'xtensa-esp32-espidf' || matrix.target == 'xtensa-esp32s3-espidf' || matrix.target == 'xtensa-esp32s2-espidf' }}

      - name: Install ldproxy
        uses: ./.github/actions/ldproxy-cached

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-venv

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/target/
            ${{ github.workspace }}/.embuild/
          key: build-cache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            build-cache-${{ matrix.target }}-

      - name: Build examples (RISC-V)
        if: ${{ matrix.target == 'riscv32imc-esp-espidf' }}
        run: cargo build --workspace --examples --target ${{ matrix.target }} --release --offline

      - name: Build examples (Xtensa)
        if: ${{ matrix.target == 'xtensa-esp32-espidf' || matrix.target == 'xtensa-esp32s3-espidf' || matrix.target == 'xtensa-esp32s2-espidf' }}
        run: . $HOME/exports && cargo +esp build --workspace --examples --target ${{ matrix.target }} --release --offline
